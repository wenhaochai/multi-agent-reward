[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-sglang"
version = "0.1.4+sglang0.5.23"
description = "SGLang model support for Flint, ported to sglang 0.5.23 (miles v0.1.3)"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"

[project.entry-points."sglang.srt.plugins"]
flint = "flint_sglang.plugin:register"

[tool.setuptools]
packages = ["flint_sglang"]
