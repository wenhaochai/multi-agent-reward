[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-sglang"
version = "0.1.4"
description = "SGLang model support for Flint (tested with sglang 0.5.16 and transformers 5.12.1)"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"

[project.entry-points."sglang.srt.plugins"]
flint = "flint_sglang.plugin:register"

[tool.setuptools]
packages = ["flint_sglang"]
